<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BMS Bluetooth Terminal</title>
    <style>
        /* ========== RESET & GLOBAL ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #0b0e1a, #03050c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* ========== KARTU UTAMA ========== */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 28, 46, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 40px;
            padding: 24px 20px 32px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 180, 255, 0.15),
                        0 0 80px rgba(0, 200, 255, 0.05);
            transition: all 0.3s ease;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #00f0ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .status-led {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8a9bb5;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3b3b;
            box-shadow: 0 0 12px #ff3b3b88;
            transition: 0.3s;
        }

        .led.connected {
            background: #00ff88;
            box-shadow: 0 0 20px #00ff88aa;
        }

        /* ========== PANEL DATA BMS ========== */
        .bms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .bms-card {
            background: rgba(0, 20, 40, 0.5);
            border-radius: 18px;
            padding: 14px 12px;
            border: 1px solid rgba(0, 255, 255, 0.08);
            text-align: center;
            transition: 0.2s;
        }

        .bms-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6a7f9e;
            margin-bottom: 4px;
        }

        .bms-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #d0e5ff;
            font-variant-numeric: tabular-nums;
        }

        .bms-card .unit {
            font-size: 12px;
            color: #4a6a8a;
            margin-left: 2px;
        }

        .bms-card.highlight {
            border-color: rgba(0, 255, 200, 0.3);
            background: rgba(0, 255, 200, 0.05);
        }

        /* ========== TERMINAL / LOG ========== */
        .terminal {
            background: rgba(0, 10, 20, 0.7);
            border-radius: 20px;
            padding: 16px;
            height: 170px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.06);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #8bb4d8;
            scroll-behavior: smooth;
        }

        .terminal::-webkit-scrollbar {
            width: 4px;
        }
        .terminal::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 20px;
        }

        .terminal .time {
            color: #3a6a8a;
            margin-right: 8px;
        }
        .terminal .rx {
            color: #5cf0c0;
        }
        .terminal .tx {
            color: #70b0ff;
        }
        .terminal .info {
            color: #a0b8d0;
        }
        .terminal .error {
            color: #ff6b7a;
        }
        .terminal .warning {
            color: #ffd93d;
        }
        .terminal .success {
            color: #6fcf97;
        }
        .terminal .hex {
            color: #bb86fc;
            font-weight: bold;
        }
        .terminal .ascii {
            color: #4fc3f7;
        }

        /* ========== INPUT + TOMBOL ========== */
        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            background: rgba(0, 20, 40, 0.6);
            color: #d0e5ff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-row input::placeholder {
            color: #3a5a7a;
        }
        .input-row input:focus {
            border-color: #00e0ff;
            box-shadow: 0 0 24px rgba(0, 224, 255, 0.1);
        }

        .btn {
            padding: 14px 22px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c8ff, #7b61ff);
            color: #fff;
            box-shadow: 0 4px 24px rgba(0, 200, 255, 0.25);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 32px rgba(0, 200, 255, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(0, 200, 255, 0.08);
            color: #7bb8e0;
            border: 1px solid rgba(0, 200, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(0, 200, 255, 0.15);
        }

        .btn-danger {
            background: rgba(255, 60, 60, 0.12);
            color: #ff7a7a;
            border: 1px solid rgba(255, 60, 60, 0.15);
        }
        .btn-danger:hover {
            background: rgba(255, 60, 60, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-success {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.15);
        }
        .btn-success:hover {
            background: rgba(0, 255, 136, 0.2);
        }

        .btn-hex {
            background: rgba(187, 134, 252, 0.12);
            color: #bb86fc;
            border: 1px solid rgba(187, 134, 252, 0.15);
        }
        .btn-hex:hover {
            background: rgba(187, 134, 252, 0.2);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 420px) {
            .container { padding: 18px 14px 24px; }
            .bms-grid { gap: 8px; }
            .bms-card .value { font-size: 18px; }
            .input-row { flex-wrap: wrap; }
            .input-row input { min-width: 100%; }
            .btn-group { width: 100%; justify-content: stretch; }
            .btn-group .btn { flex: 1; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>⚡ BMS Terminal</h1>
        <div class="status-led">
            <span id="statusText">Putus</span>
            <span class="led" id="ledIndicator"></span>
        </div>
    </div>

    <!-- PANEL BMS -->
    <div class="bms-grid">
        <div class="bms-card highlight">
            <div class="label">Tegangan</div>
            <div class="value"><span id="bmsVoltage">--</span><span class="unit">V</span></div>
        </div>
        <div class="bms-card highlight">
            <div class="label">Arus</div>
            <div class="value"><span id="bmsCurrent">--</span><span class="unit">A</span></div>
        </div>
        <div class="bms-card">
            <div class="label">SOC</div>
            <div class="value"><span id="bmsSoc">--</span><span class="unit">%</span></div>
        </div>
        <div class="bms-card">
            <div class="label">Suhu</div>
            <div class="value"><span id="bmsTemp">--</span><span class="unit">°C</span></div>
        </div>
    </div>

    <!-- TERMINAL LOG -->
    <div class="terminal" id="terminalLog">
        <div><span class="time">[system]</span> <span class="info">▶ Siap menerima data BMS</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Klik "Cari BMS" untuk mulai</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Data akan ditampilkan dalam format HEX</span></div>
    </div>

    <!-- INPUT + TOMBOL -->
    <div class="input-row">
        <input type="text" id="inputField" placeholder="Kirim perintah (HEX: 01 03 00 00)" />
        <button class="btn btn-primary" id="sendBtn">🚀 Kirim</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-secondary" id="scanBtn">🔍 Cari BMS</button>
        <button class="btn btn-hex" id="testBtn">🧪 Test HEX</button>
        <button class="btn btn-danger" id="disconnectBtn">⛔ Putus</button>
    </div>

</div>

<script>
    // ============================================================
    // 1.  ELEMEN DOM
    // ============================================================
    const terminalLog = document.getElementById('terminalLog');
    const inputField = document.getElementById('inputField');
    const sendBtn = document.getElementById('sendBtn');
    const scanBtn = document.getElementById('scanBtn');
    const testBtn = document.getElementById('testBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const ledIndicator = document.getElementById('ledIndicator');
    const statusText = document.getElementById('statusText');

    // Elemen BMS
    const bmsVoltage = document.getElementById('bmsVoltage');
    const bmsCurrent = document.getElementById('bmsCurrent');
    const bmsSoc = document.getElementById('bmsSoc');
    const bmsTemp = document.getElementById('bmsTemp');

    // ============================================================
    // 2.  STATE
    // ============================================================
    let device = null;
    let server = null;
    let characteristic = null;
    let isConnected = false;

    // ============================================================
    // 3.  FUNGSI LOG TERMINAL - KHUSUS HEX
    // ============================================================
    function logTerminal(message, type = 'info', showHex = false) {
        const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
        const entry = document.createElement('div');
        
        if (showHex) {
            // Tampilkan data dalam format HEX yang rapi
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="hex">📥 HEX: ${message}</span>`;
        } else if (type === 'tx') {
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="tx">📤 ${message}</span>`;
        } else {
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${message}</span>`;
        }
        
        terminalLog.appendChild(entry);
        terminalLog.scrollTop = terminalLog.scrollHeight;
        if (terminalLog.children.length > 120) {
            terminalLog.removeChild(terminalLog.children[0]);
        }
    }

    // ============================================================
    // 4.  KONVERSI DATA KE HEX
    // ============================================================
    function toHexString(buffer) {
        const bytes = new Uint8Array(buffer);
        let hex = '';
        for (let i = 0; i < bytes.length; i++) {
            hex += bytes[i].toString(16).padStart(2, '0').toUpperCase();
            if (i < bytes.length - 1) hex += ' ';
        }
        return hex;
    }

    function toAsciiString(buffer) {
        const bytes = new Uint8Array(buffer);
        let ascii = '';
        for (let i = 0; i < bytes.length; i++) {
            const char = String.fromCharCode(bytes[i]);
            ascii += (bytes[i] >= 32 && bytes[i] <= 126) ? char : '.';
        }
        return ascii;
    }

    // ============================================================
    // 5.  UPDATE UI BMS (DARI HEX DATA)
    // ============================================================
    function parseHexToBMS(hexString) {
        try {
            // Hapus spasi dan convert ke array bytes
            const cleanHex = hexString.replace(/\s/g, '');
            const bytes = [];
            for (let i = 0; i < cleanHex.length; i += 2) {
                bytes.push(parseInt(cleanHex.substr(i, 2), 16));
            }

            // Jika data cukup panjang, coba parse
            if (bytes.length >= 8) {
                // Contoh parsing untuk data BMS dengan format tertentu
                // Sesuaikan dengan protocol BMS Anda
                const voltage = ((bytes[3] << 8) + bytes[4]) / 100;
                const current = ((bytes[5] << 8) + bytes[6]) / 100;
                const soc = bytes[7] / 1.0;
                const temperature = bytes[8] / 1.0;

                // Validasi nilai masuk akal
                if (voltage > 0 && voltage < 100) {
                    return { voltage, current, soc, temperature };
                }
            }

            // Coba parse sebagai ASCII
            const ascii = String.fromCharCode(...bytes);
            const numbers = ascii.match(/[\d.]+/g);
            if (numbers && numbers.length >= 3) {
                const vals = numbers.map(Number);
                if (vals[0] > 0 && vals[0] < 100) {
                    return {
                        voltage: vals[0],
                        current: vals[1] || 0,
                        soc: vals[2] || 0,
                        temperature: vals[3] || 0
                    };
                }
            }

            return null;
        } catch (e) {
            return null;
        }
    }

    function updateBmsUI(data) {
        if (data.voltage !== undefined && !isNaN(data.voltage)) {
            bmsVoltage.textContent = data.voltage.toFixed(2);
        }
        if (data.current !== undefined && !isNaN(data.current)) {
            bmsCurrent.textContent = data.current.toFixed(2);
        }
        if (data.soc !== undefined && !isNaN(data.soc)) {
            bmsSoc.textContent = data.soc.toFixed(1);
        }
        if (data.temperature !== undefined && !isNaN(data.temperature)) {
            bmsTemp.textContent = data.temperature.toFixed(1);
        }
    }

    function resetBmsUI() {
        bmsVoltage.textContent = '--';
        bmsCurrent.textContent = '--';
        bmsSoc.textContent = '--';
        bmsTemp.textContent = '--';
    }

    // ============================================================
    // 6.  HANDLE DATA MASUK DARI BLUETOOTH
    // ============================================================
    function handleBmsData(buffer) {
        // Konversi ke HEX
        const hexString = toHexString(buffer);
        const asciiString = toAsciiString(buffer);
        
        // Tampilkan di terminal dalam format HEX
        logTerminal(hexString, 'hex', true);
        
        // Tampilkan ASCII juga (opsional)
        if (asciiString.trim().length > 0) {
            const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
            const entry = document.createElement('div');
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="ascii">📝 ASCII: ${asciiString}</span>`;
            terminalLog.appendChild(entry);
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        // Coba parsing dari HEX
        const parsed = parseHexToBMS(hexString);
        if (parsed) {
            const hasValid = Object.values(parsed).some(v => typeof v === 'number' && !isNaN(v) && v > 0);
            if (hasValid) {
                updateBmsUI(parsed);
                const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
                const entry = document.createElement('div');
                const logMsg = Object.entries(parsed)
                    .filter(([_, v]) => !isNaN(v) && v > 0)
                    .map(([k, v]) => `${k}: ${v.toFixed(2)}`)
                    .join(', ');
                entry.innerHTML = `<span class="time">[${time}]</span> <span class="success">✅ Data: ${logMsg}</span>`;
                terminalLog.appendChild(entry);
                terminalLog.scrollTop = terminalLog.scrollHeight;
            }
        }
    }

    // ============================================================
    // 7.  KONEKSI BLUETOOTH
    // ============================================================
    async function connectBle() {
        try {
            logTerminal('🔍 Mencari perangkat BMS...', 'info');

            device = await navigator.bluetooth.requestDevice({
                filters: [
                    { services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }
                ]
            });

            logTerminal(`✅ Terhubung ke: ${device.name || 'Tanpa Nama'}`, 'success');

            server = await device.gatt.connect();
            isConnected = true;
            updateStatus(true);

            const serviceUUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
            const charUUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

            let service;
            try {
                service = await server.getPrimaryService(serviceUUID);
            } catch (_) {
                const services = await server.getPrimaryServices();
                if (services.length === 0) throw new Error('Tidak ada service');
                service = services[0];
                logTerminal(`ℹ️ Menggunakan service: ${service.uuid}`, 'info');
            }

            characteristic = await service.getCharacteristic(charUUID);
            logTerminal('✅ Karakteristik ditemukan', 'success');

            if (characteristic.properties.notify) {
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    handleBmsData(value.buffer);
                });
                logTerminal('📡 Notifikasi diaktifkan (data HEX akan ditampilkan)', 'info');
            } else {
                logTerminal('⚠️ Karakteristik tidak support notifikasi', 'warning');
            }

            try {
                const value = await characteristic.readValue();
                handleBmsData(value.buffer);
            } catch (_) { /* ignore */ }

        } catch (error) {
            logTerminal(`❌ Error: ${error.message}`, 'error');
            resetBmsUI();
            updateStatus(false);
        }
    }

    // ============================================================
    // 8.  KIRIM DATA (HEX FORMAT)
    // ============================================================
    async function sendData(text) {
        if (!isConnected || !characteristic) {
            logTerminal('❌ Belum terhubung ke BMS', 'error');
            return;
        }

        try {
            // Jika input berupa HEX (contoh: "01 03 00 00")
            let dataToSend;
            if (text.match(/^[0-9A-Fa-f\s]+$/)) {
                const hexString = text.replace(/\s/g, '');
                const bytes = [];
                for (let i = 0; i < hexString.length; i += 2) {
                    bytes.push(parseInt(hexString.substr(i, 2), 16));
                }
                dataToSend = new Uint8Array(bytes);
                logTerminal(`📤 HEX: ${text}`, 'tx');
            } else {
                // Kirim sebagai teks biasa
                const encoder = new TextEncoder();
                dataToSend = encoder.encode(text + '\n');
                logTerminal(`📤 ${text}`, 'tx');
            }
            
            await characteristic.writeValue(dataToSend);
            
            // Tampilkan HEX yang dikirim
            const hexSent = toHexString(dataToSend);
            if (text.match(/^[0-9A-Fa-f\s]+$/)) {
                // Sudah ditampilkan di atas
            } else {
                const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
                const entry = document.createElement('div');
                entry.innerHTML = `<span class="time">[${time}]</span> <span class="hex">📤 HEX: ${hexSent}</span>`;
                terminalLog.appendChild(entry);
                terminalLog.scrollTop = terminalLog.scrollHeight;
            }
        } catch (error) {
            logTerminal(`❌ Gagal kirim: ${error.message}`, 'error');
        }
    }

    // ============================================================
    // 9.  PUTUS KONEKSI
    // ============================================================
    function disconnect() {
        if (device && device.gatt) {
            try { device.gatt.disconnect(); } catch (_) {}
        }
        isConnected = false;
        device = null;
        server = null;
        characteristic = null;
        updateStatus(false);
        resetBmsUI();
        logTerminal('⛔ Koneksi diputus', 'error');
    }

    // ============================================================
    // 10. UPDATE STATUS UI
    // ============================================================
    function updateStatus(connected) {
        if (connected) {
            ledIndicator.className = 'led connected';
            statusText.textContent = 'Terhubung';
        } else {
            ledIndicator.className = 'led';
            statusText.textContent = 'Putus';
        }
    }

    // ============================================================
    // 11. TEST DATA HEX (UNTUK DEBUGGING)
    // ============================================================
    function testHexData() {
        // Contoh data HEX dari BMS
        const testHexData = [
            '01 03 02 0C 8A 79 03 7B',
            '02 01 00 08 00 00 00 00 00 00',
            '48 65 6C 6C 6F 20 42 4D 53',
            '01 03 04 12 34 56 78 E5 9A'
        ];
        
        const randomHex = testHexData[Math.floor(Math.random() * testHexData.length)];
        logTerminal(`🧪 Test HEX: ${randomHex}`, 'warning');
        
        // Konversi string HEX ke buffer
        const cleanHex = randomHex.replace(/\s/g, '');
        const bytes = [];
        for (let i = 0; i < cleanHex.length; i += 2) {
            bytes.push(parseInt(cleanHex.substr(i, 2), 16));
        }
        const buffer = new Uint8Array(bytes).buffer;
        handleBmsData(buffer);
    }

    // ============================================================
    // 12. EVENT LISTENER
    // ============================================================
    scanBtn.addEventListener('click', connectBle);
    testBtn.addEventListener('click', testHexData);

    sendBtn.addEventListener('click', () => {
        const text = inputField.value.trim();
        if (!text) {
            logTerminal('⚠️ Kolom input kosong', 'error');
            return;
        }
        sendData(text);
        inputField.value = '';
    });

    inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendBtn.click();
        }
    });

    disconnectBtn.addEventListener('click', disconnect);

    // ============================================================
    // 13. INISIALISASI
    // ============================================================
    logTerminal('🚀 Web BMS Terminal siap', 'info');
    logTerminal('💡 Pastikan Bluetooth HP aktif', 'info');
    logTerminal('📌 Klik "Cari BMS" untuk mulai scanning', 'info');
    logTerminal('📌 Data akan ditampilkan dalam format HEX', 'info');
    logTerminal('📌 Kirim perintah dalam format HEX: 01 03 00 00', 'info');

    if (!navigator.bluetooth) {
        logTerminal('❌ Browser tidak mendukung Web Bluetooth API', 'error');
        logTerminal('ℹ️ Gunakan Chrome di Android / Desktop', 'error');
    }
</script>

</body>
</html>
