<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BMS Bluetooth Terminal</title>
    <style>
        /* ========== RESET & GLOBAL ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #0b0e1a, #03050c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* ========== KARTU UTAMA ========== */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 28, 46, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 40px;
            padding: 24px 20px 32px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 180, 255, 0.15),
                        0 0 80px rgba(0, 200, 255, 0.05);
            transition: all 0.3s ease;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #00f0ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .status-led {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8a9bb5;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3b3b;
            box-shadow: 0 0 12px #ff3b3b88;
            transition: 0.3s;
        }

        .led.connected {
            background: #00ff88;
            box-shadow: 0 0 20px #00ff88aa;
        }

        /* ========== PANEL DATA BMS ========== */
        .bms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .bms-card {
            background: rgba(0, 20, 40, 0.5);
            border-radius: 18px;
            padding: 14px 12px;
            border: 1px solid rgba(0, 255, 255, 0.08);
            text-align: center;
            transition: 0.2s;
        }

        .bms-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6a7f9e;
            margin-bottom: 4px;
        }

        .bms-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #d0e5ff;
            font-variant-numeric: tabular-nums;
        }

        .bms-card .unit {
            font-size: 12px;
            color: #4a6a8a;
            margin-left: 2px;
        }

        .bms-card.highlight {
            border-color: rgba(0, 255, 200, 0.3);
            background: rgba(0, 255, 200, 0.05);
        }

        /* ========== TERMINAL / LOG ========== */
        .terminal {
            background: rgba(0, 10, 20, 0.7);
            border-radius: 20px;
            padding: 16px;
            height: 170px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.06);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            line-height: 1.6;
            color: #8bb4d8;
            scroll-behavior: smooth;
        }

        .terminal::-webkit-scrollbar {
            width: 4px;
        }
        .terminal::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 20px;
        }

        .terminal .time {
            color: #3a6a8a;
            margin-right: 6px;
        }
        .terminal .rx {
            color: #5cf0c0;
        }
        .terminal .tx {
            color: #70b0ff;
        }
        .terminal .info {
            color: #a0b8d0;
        }
        .terminal .error {
            color: #ff6b7a;
        }
        .terminal .warning {
            color: #ffd93d;
        }
        .terminal .success {
            color: #6fcf97;
        }
        .terminal .hex {
            color: #bb86fc;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .terminal .hex-dev {
            color: #4fc3f7;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .terminal .hex-bms {
            color: #ffd54f;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .terminal .data-label {
            color: #81d4fa;
        }
        .terminal .data-value {
            color: #ffffff;
            font-weight: bold;
        }
        .terminal .data-unit {
            color: #78909c;
        }
        .terminal .progress {
            color: #ffab40;
        }
        .terminal .crc-ok {
            color: #69f0ae;
        }
        .terminal .crc-err {
            color: #ff5252;
        }

        /* ========== PROGRESS BAR ========== */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-bottom: 12px;
            overflow: hidden;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00c8ff, #7b61ff);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* ========== INPUT + TOMBOL ========== */
        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            background: rgba(0, 20, 40, 0.6);
            color: #d0e5ff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        .input-row input::placeholder {
            color: #3a5a7a;
        }
        .input-row input:focus {
            border-color: #00e0ff;
            box-shadow: 0 0 24px rgba(0, 224, 255, 0.1);
        }

        .btn {
            padding: 14px 22px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c8ff, #7b61ff);
            color: #fff;
            box-shadow: 0 4px 24px rgba(0, 200, 255, 0.25);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 32px rgba(0, 200, 255, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(0, 200, 255, 0.08);
            color: #7bb8e0;
            border: 1px solid rgba(0, 200, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(0, 200, 255, 0.15);
        }

        .btn-danger {
            background: rgba(255, 60, 60, 0.12);
            color: #ff7a7a;
            border: 1px solid rgba(255, 60, 60, 0.15);
        }
        .btn-danger:hover {
            background: rgba(255, 60, 60, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-success {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.15);
        }
        .btn-success:hover {
            background: rgba(0, 255, 136, 0.2);
        }

        .btn-dev {
            background: rgba(79, 195, 247, 0.12);
            color: #4fc3f7;
            border: 1px solid rgba(79, 195, 247, 0.15);
            flex: 1;
        }
        .btn-dev:hover {
            background: rgba(79, 195, 247, 0.2);
        }

        .btn-bms {
            background: rgba(255, 213, 79, 0.12);
            color: #ffd54f;
            border: 1px solid rgba(255, 213, 79, 0.15);
            flex: 1;
        }
        .btn-bms:hover {
            background: rgba(255, 213, 79, 0.2);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 420px) {
            .container { padding: 18px 14px 24px; }
            .bms-grid { gap: 8px; }
            .bms-card .value { font-size: 18px; }
            .input-row { flex-wrap: wrap; }
            .input-row input { min-width: 100%; }
            .btn-group { width: 100%; }
            .btn-group .btn { flex: 1; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>⚡ BMS Terminal</h1>
        <div class="status-led">
            <span id="statusText">Putus</span>
            <span class="led" id="ledIndicator"></span>
        </div>
    </div>

    <!-- PANEL BMS -->
    <div class="bms-grid">
        <div class="bms-card highlight">
            <div class="label">Tegangan</div>
            <div class="value"><span id="bmsVoltage">--</span><span class="unit">V</span></div>
        </div>
        <div class="bms-card highlight">
            <div class="label">Arus</div>
            <div class="value"><span id="bmsCurrent">--</span><span class="unit">A</span></div>
        </div>
        <div class="bms-card">
            <div class="label">SOC</div>
            <div class="value"><span id="bmsSoc">--</span><span class="unit">%</span></div>
        </div>
        <div class="bms-card">
            <div class="label">Suhu</div>
            <div class="value"><span id="bmsTemp">--</span><span class="unit">°C</span></div>
        </div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- TERMINAL LOG -->
    <div class="terminal" id="terminalLog">
        <div><span class="time">[system]</span> <span class="info">▶ Siap menerima data BMS</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Klik "Cari BMS" untuk mulai</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Data akan ditampilkan dalam format HEX</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Data diterima dalam 3 tahap (128+128+48 bytes)</span></div>
    </div>

    <!-- INPUT + TOMBOL -->
    <div class="input-row">
        <input type="text" id="inputField" placeholder="Kirim HEX: 01 03 00 00" />
        <button class="btn btn-primary" id="sendBtn">🚀 Kirim</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-secondary" id="scanBtn">🔍 Cari BMS</button>
        <button class="btn btn-dev" id="devInfoBtn">📱 DevInfo</button>
        <button class="btn btn-bms" id="bmsInfoBtn">🔋 BMSInfo</button>
        <button class="btn btn-danger" id="disconnectBtn">⛔ Putus</button>
    </div>

</div>

<script>
    // ============================================================
    // 1.  ELEMEN DOM
    // ============================================================
    const terminalLog = document.getElementById('terminalLog');
    const inputField = document.getElementById('inputField');
    const sendBtn = document.getElementById('sendBtn');
    const scanBtn = document.getElementById('scanBtn');
    const devInfoBtn = document.getElementById('devInfoBtn');
    const bmsInfoBtn = document.getElementById('bmsInfoBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const ledIndicator = document.getElementById('ledIndicator');
    const statusText = document.getElementById('statusText');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    // Elemen BMS
    const bmsVoltage = document.getElementById('bmsVoltage');
    const bmsCurrent = document.getElementById('bmsCurrent');
    const bmsSoc = document.getElementById('bmsSoc');
    const bmsTemp = document.getElementById('bmsTemp');

    // ============================================================
    // 2.  STATE
    // ============================================================
    let device = null;
    let server = null;
    let characteristic = null;
    let isConnected = false;

    // Buffer untuk menyimpan data dari multiple packets
    let dataBuffer = [];
    let expectedTotalBytes = 304; // 128 + 128 + 48
    let packetCount = 0;
    let isCollectingData = false;
    let dataTimer = null;

    // ============================================================
    // 3.  CRC CALCULATION (CRC16/XMODEM)
    // ============================================================
    function calculateCRC16(data) {
        let crc = 0x0000;
        for (let i = 0; i < data.length; i++) {
            crc ^= (data[i] << 8);
            for (let j = 0; j < 8; j++) {
                if (crc & 0x8000) {
                    crc = (crc << 1) ^ 0x1021;
                } else {
                    crc = crc << 1;
                }
            }
            crc &= 0xFFFF;
        }
        return crc;
    }

    // ============================================================
    // 4.  JK BMS PARSER (RESMI)
    // ============================================================
    class JKBMSParser {
        constructor() {
            this.offset = 0;
            this.cells = 0;
            this.is32S = false;
        }

        getUint16(data, offset) {
            if (offset + 1 >= data.length) return 0;
            return (data[offset + 1] << 8) | data[offset];
        }

        getInt16(data, offset) {
            const val = this.getUint16(data, offset);
            return val > 0x7FFF ? val - 0x10000 : val;
        }

        getUint32(data, offset) {
            if (offset + 3 >= data.length) return 0;
            return (data[offset + 3] << 24) | 
                   (data[offset + 2] << 16) | 
                   (data[offset + 1] << 8) | 
                   data[offset];
        }

        getInt32(data, offset) {
            const val = this.getUint32(data, offset);
            return val > 0x7FFFFFFF ? val - 0x100000000 : val;
        }

        getEnabledCells(data) {
            const mask = this.getUint32(data, 54);
            const enabled = [];
            for (let i = 0; i < 32; i++) {
                if (mask & (1 << i)) {
                    enabled.push(i + 1);
                }
            }
            return enabled;
        }

        isFrame32S(data) {
            const mask = this.getUint32(data, 54);
            return mask === 0xFFFFFFFF;
        }

        parse(data) {
            if (data.length < 6 || 
                data[0] !== 0x55 || data[1] !== 0xAA || 
                data[2] !== 0xEB || data[3] !== 0x90) {
                throw new Error('Invalid JK BMS header');
            }

            const recordType = data[4];
            const frameCounter = data[5];
            
            this.is32S = this.isFrame32S(data);
            this.offset = this.is32S ? 32 : 0;
            
            const enabledCells = this.getEnabledCells(data);
            this.cells = enabledCells.length;

            const result = {
                header: {
                    recordType: recordType,
                    frameCounter: frameCounter,
                    is32S: this.is32S,
                    enabledCells: enabledCells,
                    totalCells: this.cells,
                    dataLength: data.length
                },
                cells: [],
                cellVoltages: [],
                cellResistances: [],
                temperatures: [],
                status: {},
                statistics: {}
            };

            // Parse Cell Voltages (offset 6)
            let minVoltage = 100;
            let maxVoltage = 0;
            let totalVoltage = 0;
            let validCells = 0;

            for (let i = 0; i < this.cells; i++) {
                const offset = 6 + (i * 2);
                if (offset + 1 >= data.length) break;
                const raw = this.getUint16(data, offset);
                const voltage = raw * 0.001;
                
                result.cellVoltages.push({
                    cell: i + 1,
                    raw: raw,
                    voltage: voltage
                });

                if (voltage > 0) {
                    totalVoltage += voltage;
                    validCells++;
                    if (voltage < minVoltage) minVoltage = voltage;
                    if (voltage > maxVoltage) maxVoltage = voltage;
                }
            }

            result.statistics.minCellVoltage = minVoltage === 100 ? 0 : minVoltage;
            result.statistics.maxCellVoltage = maxVoltage;
            result.statistics.averageCellVoltage = validCells > 0 ? totalVoltage / validCells : 0;
            result.statistics.deltaVoltage = maxVoltage - minVoltage;
            result.statistics.validCells = validCells;

            // Parse Cell Resistances (offset 64 + offset)
            for (let i = 0; i < this.cells; i++) {
                const offset = 64 + this.offset + (i * 2);
                if (offset + 1 >= data.length) break;
                const raw = this.getUint16(data, offset);
                const resistance = raw * 0.001;
                
                result.cellResistances.push({
                    cell: i + 1,
                    raw: raw,
                    resistance: resistance
                });
            }

            // Parse Temperatures
            const tempBaseOffset = 130 + this.offset;
            const tempSensors = [
                { sensor: 1, offset: tempBaseOffset },
                { sensor: 2, offset: tempBaseOffset + 2 },
                { sensor: 3, offset: tempBaseOffset + 4 }
            ];

            if (this.is32S) {
                tempSensors.push(
                    { sensor: 4, offset: 222 + this.offset },
                    { sensor: 5, offset: 224 + this.offset }
                );
            }

            for (const ts of tempSensors) {
                if (ts.offset + 1 >= data.length) continue;
                const raw = this.getInt16(data, ts.offset);
                result.temperatures.push({
                    sensor: ts.sensor,
                    raw: raw,
                    temp: raw * 0.1
                });
            }

            // Parse Main Status
            const status = {
                totalVoltage: 0,
                current: 0,
                soc: 0,
                soh: 0,
                capacityRemain: 0,
                capacityNominal: 0,
                cycleCount: 0,
                balanceCurrent: 0,
                chargingMOS: false,
                dischargingMOS: false,
                balancing: false,
                totalRuntime: 0
            };

            if (118 + this.offset + 3 < data.length) {
                status.totalVoltage = this.getUint32(data, 118 + this.offset) * 0.001;
            }
            if (126 + this.offset + 3 < data.length) {
                status.current = this.getInt32(data, 126 + this.offset) * 0.001;
            }
            if (141 + this.offset < data.length) {
                status.soc = data[141 + this.offset] || 0;
            }
            if (158 + this.offset < data.length) {
                status.soh = data[158 + this.offset] || 0;
            }
            if (142 + this.offset + 3 < data.length) {
                status.capacityRemain = this.getUint32(data, 142 + this.offset) * 0.001;
            }
            if (146 + this.offset + 3 < data.length) {
                status.capacityNominal = this.getUint32(data, 146 + this.offset) * 0.001;
            }
            if (150 + this.offset + 3 < data.length) {
                status.cycleCount = this.getUint32(data, 150 + this.offset);
            }
            if (138 + this.offset + 1 < data.length) {
                status.balanceCurrent = this.getInt16(data, 138 + this.offset) * 0.001;
            }
            if (166 + this.offset < data.length) {
                status.chargingMOS = (data[166 + this.offset] || 0) === 1;
            }
            if (167 + this.offset < data.length) {
                status.dischargingMOS = (data[167 + this.offset] || 0) === 1;
            }
            if (169 + this.offset < data.length) {
                status.balancing = (data[169 + this.offset] || 0) === 1;
            }
            if (162 + this.offset + 3 < data.length) {
                status.totalRuntime = this.getUint32(data, 162 + this.offset);
            }

            status.power = status.totalVoltage * status.current;
            status.chargingPower = Math.max(0, status.power);
            status.dischargingPower = Math.abs(Math.min(0, status.power));

            if (this.is32S) {
                if (243 + this.offset < data.length) {
                    const typeCode = data[243 + this.offset] || 0;
                    const types = ['LFP (LiFePO4)', 'Li-ion (NMC)', 'LTO'];
                    status.batteryType = types[typeCode] || 'Unknown';
                    status.batteryTypeCode = typeCode;
                }
                if (248 + this.offset < data.length) {
                    const chargeCode = data[248 + this.offset] || 0;
                    const statuses = ['Bulk', 'Absorption', 'Float'];
                    status.chargeStatus = statuses[chargeCode] || 'Unknown';
                    status.chargeStatusCode = chargeCode;
                }
            }

            result.status = status;

            // MOS Temperature
            if (this.is32S) {
                if (112 + this.offset + 1 < data.length) {
                    const mosTemp = this.getInt16(data, 112 + this.offset);
                    result.mosTemperature = mosTemp * 0.1;
                }
            } else {
                if (134 + this.offset + 1 < data.length) {
                    const mosTemp = this.getInt16(data, 134 + this.offset);
                    result.mosTemperature = mosTemp * 0.1;
                }
            }

            return result;
        }

        formatOutput(result) {
            let lines = [];
            const s = result.status;
            
            lines.push(`📊 JK BMS ${result.header.is32S ? '32S' : '24S'} | Cells: ${result.header.totalCells} | Len: ${result.header.dataLength}`);
            lines.push(`⚡ Voltage: ${s.totalVoltage.toFixed(2)}V | Current: ${s.current.toFixed(2)}A`);
            lines.push(`🔋 SOC: ${s.soc}% | SOH: ${s.soh}%`);
            lines.push(`📦 Capacity: ${s.capacityRemain.toFixed(1)}/${s.capacityNominal.toFixed(1)}Ah`);
            lines.push(`🔄 Cycle: ${s.cycleCount} | Runtime: ${this.formatRuntime(s.totalRuntime)}`);
            if (result.temperatures.length > 0) {
                lines.push(`🌡️ Temp: ${result.temperatures.map(t => t.temp.toFixed(1)).join('°C, ')}°C`);
            }
            lines.push(`🔽 Min Cell: ${result.statistics.minCellVoltage.toFixed(3)}V`);
            lines.push(`🔼 Max Cell: ${result.statistics.maxCellVoltage.toFixed(3)}V`);
            lines.push(`📊 Delta: ${result.statistics.deltaVoltage.toFixed(3)}V | Avg: ${result.statistics.averageCellVoltage.toFixed(3)}V`);
            lines.push(`⚙️ MOS: ${s.chargingMOS ? 'CHG✓' : 'CHG✗'} ${s.dischargingMOS ? 'DSG✓' : 'DSG✗'} | Balance: ${s.balancing ? 'ON' : 'OFF'}`);
            
            if (result.header.is32S) {
                if (s.batteryType) lines.push(`🔋 Battery: ${s.batteryType}`);
                if (s.chargeStatus) lines.push(`⚡ Charge: ${s.chargeStatus}`);
            }
            
            return lines;
        }

        formatRuntime(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            if (days > 0) return `${days}d ${hours}h`;
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }

        getCellVoltages(result) {
            return result.cellVoltages.map(c => c.voltage);
        }

        getCellResistances(result) {
            return result.cellResistances.map(c => c.resistance);
        }
    }

    // ============================================================
    // 5.  FUNGSI LOG TERMINAL
    // ============================================================
    function logTerminal(message, type = 'info') {
        const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
        const entry = document.createElement('div');
        
        const typeMap = {
            'hex_rx': `<span class="time">[${time}]</span> <span class="hex">📥 ${message}</span>`,
            'hex_tx': `<span class="time">[${time}]</span> <span class="hex">📤 ${message}</span>`,
            'hex_dev': `<span class="time">[${time}]</span> <span class="hex-dev">📱 DEV: ${message}</span>`,
            'hex_bms': `<span class="time">[${time}]</span> <span class="hex-bms">🔋 BMS: ${message}</span>`,
            'tx': `<span class="time">[${time}]</span> <span class="tx">📤 ${message}</span>`,
            'success': `<span class="time">[${time}]</span> <span class="success">✅ ${message}</span>`,
            'error': `<span class="time">[${time}]</span> <span class="error">❌ ${message}</span>`,
            'warning': `<span class="time">[${time}]</span> <span class="warning">⚠️ ${message}</span>`,
            'progress': `<span class="time">[${time}]</span> <span class="progress">⏳ ${message}</span>`,
            'crc-ok': `<span class="time">[${time}]</span> <span class="crc-ok">✅ CRC: ${message}</span>`,
            'crc-err': `<span class="time">[${time}]</span> <span class="crc-err">❌ CRC: ${message}</span>`,
            'data': `<span class="time">[${time}]</span> ${message}`,
        };
        
        entry.innerHTML = typeMap[type] || `<span class="time">[${time}]</span> <span class="${type}">${message}</span>`;
        
        terminalLog.appendChild(entry);
        terminalLog.scrollTop = terminalLog.scrollHeight;
        if (terminalLog.children.length > 200) {
            terminalLog.removeChild(terminalLog.children[0]);
        }
    }

    // ============================================================
    // 6.  KONVERSI DATA KE HEX
    // ============================================================
    function toHexString(buffer) {
        const bytes = new Uint8Array(buffer);
        let hex = '';
        for (let i = 0; i < bytes.length; i++) {
            hex += bytes[i].toString(16).padStart(2, '0').toUpperCase();
            if (i < bytes.length - 1) hex += ' ';
        }
        return hex;
    }

    function hexStringToBytes(hexString) {
        const cleanHex = hexString.replace(/\s/g, '');
        const bytes = [];
        for (let i = 0; i < cleanHex.length; i += 2) {
            bytes.push(parseInt(cleanHex.substr(i, 2), 16));
        }
        return bytes;
    }

    function arrayToHexString(bytes) {
        let hex = '';
        for (let i = 0; i < bytes.length; i++) {
            hex += bytes[i].toString(16).padStart(2, '0').toUpperCase();
            if (i < bytes.length - 1) hex += ' ';
        }
        return hex;
    }

    // ============================================================
    // 7.  UPDATE UI BMS
    // ============================================================
    function updateBmsUI(data) {
        if (data.voltage !== undefined && !isNaN(data.voltage) && data.voltage > 0) {
            bmsVoltage.textContent = data.voltage.toFixed(2);
        }
        if (data.current !== undefined && !isNaN(data.current)) {
            bmsCurrent.textContent = data.current.toFixed(2);
        }
        if (data.soc !== undefined && !isNaN(data.soc) && data.soc >= 0 && data.soc <= 100) {
            bmsSoc.textContent = data.soc.toFixed(1);
        }
        if (data.temperature !== undefined && !isNaN(data.temperature)) {
            bmsTemp.textContent = data.temperature.toFixed(1);
        }
    }

    function resetBmsUI() {
        bmsVoltage.textContent = '--';
        bmsCurrent.textContent = '--';
        bmsSoc.textContent = '--';
        bmsTemp.textContent = '--';
    }

    // ============================================================
    // 8.  UPDATE PROGRESS
    // ============================================================
    function updateProgress(percent) {
        progressContainer.classList.add('active');
        progressBar.style.width = percent + '%';
        if (percent >= 100) {
            setTimeout(() => {
                progressContainer.classList.remove('active');
                progressBar.style.width = '0%';
            }, 500);
        }
    }

    // ============================================================
    // 9.  HANDLE DATA MASUK DARI BLUETOOTH (DENGAN BUFFER)
    // ============================================================
    function handleBmsData(buffer) {
        const bytes = new Uint8Array(buffer);
        const hexString = toHexString(buffer);
        
        // Tampilkan data yang diterima
        logTerminal(`📦 Packet ${packetCount + 1}: ${bytes.length} bytes`, 'progress');
        logTerminal(hexString, 'hex_rx');
        
        // Tambahkan ke buffer
        dataBuffer.push(...Array.from(bytes));
        packetCount++;
        
        // Update progress
        const progress = Math.min((dataBuffer.length / expectedTotalBytes) * 100, 100);
        updateProgress(progress);
        
        // Reset timer
        if (dataTimer) {
            clearTimeout(dataTimer);
        }
        
        // Set timer untuk menunggu data selesai (500ms timeout)
        dataTimer = setTimeout(() => {
            processCompleteData();
        }, 500);
    }

    // ============================================================
    // 10. PROSES DATA SETELAH SEMUA PAKET TERKUMPUL
    // ============================================================
    function processCompleteData() {
        if (dataBuffer.length === 0) {
            logTerminal('⚠️ Tidak ada data untuk diproses', 'warning');
            resetCollector();
            return;
        }

        logTerminal(`📊 Total data terkumpul: ${dataBuffer.length} bytes`, 'progress');
        
        // Tampilkan data lengkap dalam HEX
        const fullHex = arrayToHexString(dataBuffer);
        logTerminal(`📦 Full Data: ${fullHex.substring(0, 200)}${fullHex.length > 200 ? '...' : ''}`, 'hex_rx');

        // Cek CRC
        try {
            // CRC adalah byte terakhir (offset terakhir)
            const receivedCRC = dataBuffer[dataBuffer.length - 1];
            const dataWithoutCRC = dataBuffer.slice(0, dataBuffer.length - 1);
            const calculatedCRC = calculateCRC16(dataWithoutCRC) & 0xFF; // Ambil 1 byte CRC
            
            logTerminal(`CRC: Received=${receivedCRC.toString(16).padStart(2, '0').toUpperCase()}, Calculated=${calculatedCRC.toString(16).padStart(2, '0').toUpperCase()}`, 'info');
            
            if (receivedCRC === calculatedCRC) {
                logTerminal(`CRC OK (0x${receivedCRC.toString(16).padStart(2, '0').toUpperCase()})`, 'crc-ok');
                
                // Parse data dengan JK BMS Parser
                try {
                    const parser = new JKBMSParser();
                    const result = parser.parse(dataWithoutCRC);
                    
                    if (result) {
                        // Update UI
                        updateBmsUI({
                            voltage: result.status.totalVoltage,
                            current: result.status.current,
                            soc: result.status.soc,
                            temperature: result.temperatures[0]?.temp || 0
                        });

                        // Tampilkan hasil parsing
                        const outputLines = parser.formatOutput(result);
                        for (const line of outputLines) {
                            logTerminal(line, 'data');
                        }
                        logTerminal(`✅ JK BMS Parsing berhasil (${result.header.totalCells} cells, ${result.header.dataLength} bytes)`, 'success');
                    }
                } catch (parseError) {
                    logTerminal(`⚠️ Parse error: ${parseError.message}`, 'error');
                    // Fallback ke simple parser
                    try {
                        const parsed = parseSimpleBMS(dataWithoutCRC);
                        if (parsed) {
                            updateBmsUI(parsed);
                            logTerminal('✅ Simple parsing berhasil (fallback)', 'success');
                        }
                    } catch (e) {
                        logTerminal(`⚠️ Fallback parser error: ${e.message}`, 'error');
                    }
                }
            } else {
                logTerminal(`CRC Mismatch! Received: 0x${receivedCRC.toString(16).padStart(2, '0').toUpperCase()}, Calculated: 0x${calculatedCRC.toString(16).padStart(2, '0').toUpperCase()}`, 'crc-err');
                
                // Coba parse tanpa CRC (untuk debugging)
                try {
                    const parser = new JKBMSParser();
                    const result = parser.parse(dataBuffer);
                    if (result) {
                        logTerminal('⚠️ Data diparse tanpa validasi CRC (untuk debugging)', 'warning');
                        updateBmsUI({
                            voltage: result.status.totalVoltage,
                            current: result.status.current,
                            soc: result.status.soc,
                            temperature: result.temperatures[0]?.temp || 0
                        });
                    }
                } catch (e) {
                    logTerminal(`⚠️ Parse tanpa CRC gagal: ${e.message}`, 'error');
                }
            }
        } catch (crcError) {
            logTerminal(`⚠️ CRC calculation error: ${crcError.message}`, 'error');
        }
        
        // Reset collector
        resetCollector();
    }

    // ============================================================
    // 11. SIMPLE PARSER (FALLBACK)
    // ============================================================
    function parseSimpleBMS(data) {
        try {
            if (data.length < 142) return null;

            // Total voltage di offset 118 (4 bytes)
            const voltage = ((data[121] || 0) << 24) | 
                          ((data[120] || 0) << 16) | 
                          ((data[119] || 0) << 8) | 
                          (data[118] || 0);
            const totalVoltage = voltage * 0.001;
            
            // Current di offset 126 (4 bytes)
            let currentRaw = ((data[129] || 0) << 24) | 
                           ((data[128] || 0) << 16) | 
                           ((data[127] || 0) << 8) | 
                           (data[126] || 0);
            if (currentRaw > 0x7FFFFFFF) currentRaw = currentRaw - 0x100000000;
            const current = currentRaw * 0.001;
            
            // SOC di offset 141
            const soc = data[141] || 0;
            
            // Temperature di offset 130 (2 bytes)
            let tempRaw = ((data[131] || 0) << 8) | (data[130] || 0);
            if (tempRaw > 0x7FFF) tempRaw = tempRaw - 0x10000;
            const temperature = tempRaw * 0.1;

            if (totalVoltage > 0 && totalVoltage < 100) {
                return { voltage: totalVoltage, current, soc, temperature };
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    // ============================================================
    // 12. RESET COLLECTOR
    // ============================================================
    function resetCollector() {
        dataBuffer = [];
        packetCount = 0;
        isCollectingData = false;
        if (dataTimer) {
            clearTimeout(dataTimer);
            dataTimer = null;
        }
        updateProgress(0);
    }

    // ============================================================
    // 13. KONEKSI BLUETOOTH
    // ============================================================
    async function connectBle() {
        try {
            logTerminal('🔍 Mencari perangkat BMS...', 'info');

            device = await navigator.bluetooth.requestDevice({
                filters: [
                    { services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }
                ]
            });

            logTerminal(`✅ Terhubung ke: ${device.name || 'Tanpa Nama'}`, 'success');

            server = await device.gatt.connect();
            isConnected = true;
            updateStatus(true);

            const serviceUUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
            const charUUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

            let service;
            try {
                service = await server.getPrimaryService(serviceUUID);
            } catch (_) {
                const services = await server.getPrimaryServices();
                if (services.length === 0) throw new Error('Tidak ada service');
                service = services[0];
                logTerminal(`ℹ️ Menggunakan service: ${service.uuid}`, 'info');
            }

            characteristic = await service.getCharacteristic(charUUID);
            logTerminal('✅ Karakteristik ditemukan', 'success');

            // Reset buffer saat koneksi baru
            resetCollector();

            if (characteristic.properties.notify) {
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    handleBmsData(value.buffer);
                });
                logTerminal('📡 Notifikasi diaktifkan', 'info');
                logTerminal('📦 Menunggu data dalam 3 tahap (128+128+48 bytes)', 'info');
            } else {
                logTerminal('⚠️ Karakteristik tidak support notifikasi', 'warning');
            }

            try {
                const value = await characteristic.readValue();
                handleBmsData(value.buffer);
            } catch (_) { /* ignore */ }

        } catch (error) {
            logTerminal(`Error: ${error.message}`, 'error');
            resetBmsUI();
            updateStatus(false);
            resetCollector();
        }
    }

    // ============================================================
    // 14. KIRIM DATA HEX
    // ============================================================
    async function sendHexData(hexString, logType = 'hex_tx') {
        if (!isConnected || !characteristic) {
            logTerminal('Belum terhubung ke BMS', 'error');
            return false;
        }

        try {
            // Reset buffer sebelum kirim
            resetCollector();
            
            const bytes = hexStringToBytes(hexString);
            const dataToSend = new Uint8Array(bytes);
            await characteristic.writeValue(dataToSend);
            
            logTerminal(hexString, logType);
            return true;
        } catch (error) {
            logTerminal(`Gagal kirim: ${error.message}`, 'error');
            return false;
        }
    }

    // ============================================================
    // 15. FUNGSI KIRIM DATA KHUSUS
    // ============================================================
    async function sendDevInfo() {
        const hexData = 'AA 55 90 EB 97 00 00 00 00 00 00 00 00 00 00 00 00 00 00 11';
        await sendHexData(hexData, 'hex_dev');
    }

    async function sendBmsInfo() {
        const hexData = 'AA 55 90 EB 96 00 00 00 00 00 00 00 00 00 00 00 00 00 00 10';
        await sendHexData(hexData, 'hex_bms');
    }

    // ============================================================
    // 16. PUTUS KONEKSI
    // ============================================================
    function disconnect() {
        if (device && device.gatt) {
            try { device.gatt.disconnect(); } catch (_) {}
        }
        isConnected = false;
        device = null;
        server = null;
        characteristic = null;
        updateStatus(false);
        resetBmsUI();
        resetCollector();
        logTerminal('Koneksi diputus', 'error');
    }

    // ============================================================
    // 17. UPDATE STATUS UI
    // ============================================================
    function updateStatus(connected) {
        if (connected) {
            ledIndicator.className = 'led connected';
            statusText.textContent = 'Terhubung';
        } else {
            ledIndicator.className = 'led';
            statusText.textContent = 'Putus';
        }
    }

    // ============================================================
    // 18. EVENT LISTENER
    // ============================================================
    scanBtn.addEventListener('click', connectBle);
    devInfoBtn.addEventListener('click', sendDevInfo);
    bmsInfoBtn.addEventListener('click', sendBmsInfo);

    sendBtn.addEventListener('click', () => {
        const text = inputField.value.trim();
        if (!text) {
            logTerminal('Kolom input kosong', 'error');
            return;
        }
        if (text.match(/^[0-9A-Fa-f\s]+$/)) {
            sendHexData(text, 'hex_tx');
        } else {
            sendDataText(text);
        }
        inputField.value = '';
    });

    async function sendDataText(text) {
        if (!isConnected || !characteristic) {
            logTerminal('Belum terhubung ke BMS', 'error');
            return;
        }
        try {
            resetCollector();
            const encoder = new TextEncoder();
            const dataToSend = encoder.encode(text + '\n');
            await characteristic.writeValue(dataToSend);
            logTerminal(text, 'tx');
        } catch (error) {
            logTerminal(`Gagal kirim: ${error.message}`, 'error');
        }
    }

    inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendBtn.click();
        }
    });

    disconnectBtn.addEventListener('click', disconnect);

    // ============================================================
    // 19. INISIALISASI
    // ============================================================
    logTerminal('🚀 Web BMS Terminal siap', 'info');
    logTerminal('💡 Pastikan Bluetooth HP aktif', 'info');
    logTerminal('📌 Klik "Cari BMS" untuk mulai scanning', 'info');
    logTerminal('📌 Data akan ditampilkan dalam format HEX', 'info');
    logTerminal('📌 Tombol DevInfo: AA 55 90 EB 97 ... 11', 'info');
    logTerminal('📌 Tombol BMSInfo: AA 55 90 EB 96 ... 10', 'info');
    logTerminal('📦 Data diterima dalam 3 tahap (128+128+48 bytes) dengan CRC', 'info');
    logTerminal('📌 Menggunakan JK BMS Parser resmi', 'info');

    if (!navigator.bluetooth) {
        logTerminal('❌ Browser tidak mendukung Web Bluetooth API', 'error');
        logTerminal('ℹ️ Gunakan Chrome di Android / Desktop', 'info');
    }
</script>
