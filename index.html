<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BMS Bluetooth Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #0b0e1a, #03050c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 28, 46, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 40px;
            padding: 24px 20px 32px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 180, 255, 0.15), 0 0 80px rgba(0, 200, 255, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #00f0ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .status-led {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8a9bb5;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff3b3b;
            box-shadow: 0 0 12px #ff3b3b88;
            transition: 0.3s;
        }

        .led.connected {
            background: #00ff88;
            box-shadow: 0 0 20px #00ff88aa;
        }

        .bms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .bms-card {
            background: rgba(0, 20, 40, 0.5);
            border-radius: 18px;
            padding: 14px 12px;
            border: 1px solid rgba(0, 255, 255, 0.08);
            text-align: center;
        }

        .bms-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6a7f9e;
            margin-bottom: 4px;
        }

        .bms-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #d0e5ff;
            font-variant-numeric: tabular-nums;
        }

        .bms-card .unit {
            font-size: 12px;
            color: #4a6a8a;
            margin-left: 2px;
        }

        .bms-card.highlight {
            border-color: rgba(0, 255, 200, 0.3);
            background: rgba(0, 255, 200, 0.05);
        }

        .terminal {
            background: rgba(0, 10, 20, 0.7);
            border-radius: 20px;
            padding: 16px;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.06);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 10px;
            line-height: 1.5;
            color: #8bb4d8;
            scroll-behavior: smooth;
        }

        .terminal::-webkit-scrollbar {
            width: 4px;
        }
        .terminal::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #1a3a5a;
            border-radius: 20px;
        }

        .terminal .time {
            color: #3a6a8a;
            margin-right: 4px;
        }
        .terminal .info { color: #a0b8d0; }
        .terminal .error { color: #ff6b7a; }
        .terminal .warning { color: #ffd93d; }
        .terminal .success { color: #6fcf97; }
        .terminal .hex { color: #bb86fc; font-weight: bold; }
        .terminal .hex-dev { color: #4fc3f7; font-weight: bold; }
        .terminal .hex-bms { color: #ffd54f; font-weight: bold; }
        .terminal .progress { color: #ffab40; }
        .terminal .packet-info { color: #b39ddb; }
        .terminal .ping { color: #78909c; }
        .terminal .data { color: #ffffff; }
        .terminal .header-info { color: #4dd0e1; }
        .terminal .raw-data { color: #ffcc80; font-size: 9px; word-break: break-all; }
        .terminal .terminator { color: #ff6b6b; }
        .terminal .cell-data { color: #81c784; }
        .terminal .temp-data { color: #ffab91; }
        .terminal .stat-data { color: #90caf9; }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-bottom: 12px;
            overflow: hidden;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00c8ff, #7b61ff);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            background: rgba(0, 20, 40, 0.6);
            color: #d0e5ff;
            font-size: 15px;
            outline: none;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        .input-row input::placeholder {
            color: #3a5a7a;
        }
        .input-row input:focus {
            border-color: #00e0ff;
            box-shadow: 0 0 24px rgba(0, 224, 255, 0.1);
        }

        .btn {
            padding: 14px 22px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c8ff, #7b61ff);
            color: #fff;
            box-shadow: 0 4px 24px rgba(0, 200, 255, 0.25);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 32px rgba(0, 200, 255, 0.35);
        }

        .btn-secondary {
            background: rgba(0, 200, 255, 0.08);
            color: #7bb8e0;
            border: 1px solid rgba(0, 200, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(0, 200, 255, 0.15);
        }

        .btn-danger {
            background: rgba(255, 60, 60, 0.12);
            color: #ff7a7a;
            border: 1px solid rgba(255, 60, 60, 0.15);
        }
        .btn-danger:hover {
            background: rgba(255, 60, 60, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-dev {
            background: rgba(79, 195, 247, 0.12);
            color: #4fc3f7;
            border: 1px solid rgba(79, 195, 247, 0.15);
            flex: 1;
        }
        .btn-dev:hover {
            background: rgba(79, 195, 247, 0.2);
        }

        .btn-bms {
            background: rgba(255, 213, 79, 0.12);
            color: #ffd54f;
            border: 1px solid rgba(255, 213, 79, 0.15);
            flex: 1;
        }
        .btn-bms:hover {
            background: rgba(255, 213, 79, 0.2);
        }

        .btn-reset {
            background: rgba(255, 152, 0, 0.12);
            color: #ffa726;
            border: 1px solid rgba(255, 152, 0, 0.15);
            flex: 1;
        }
        .btn-reset:hover {
            background: rgba(255, 152, 0, 0.2);
        }

        @media (max-width: 420px) {
            .container { padding: 18px 14px 24px; }
            .bms-grid { gap: 8px; }
            .bms-card .value { font-size: 18px; }
            .input-row { flex-wrap: wrap; }
            .input-row input { min-width: 100%; }
            .btn-group { width: 100%; }
            .btn-group .btn { flex: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ BMS Terminal</h1>
        <div class="status-led">
            <span id="statusText">Putus</span>
            <span class="led" id="ledIndicator"></span>
        </div>
    </div>

    <div class="bms-grid">
        <div class="bms-card highlight">
            <div class="label">Tegangan</div>
            <div class="value"><span id="bmsVoltage">--</span><span class="unit">V</span></div>
        </div>
        <div class="bms-card highlight">
            <div class="label">Arus</div>
            <div class="value"><span id="bmsCurrent">--</span><span class="unit">A</span></div>
        </div>
        <div class="bms-card">
            <div class="label">SOC</div>
            <div class="value"><span id="bmsSoc">--</span><span class="unit">%</span></div>
        </div>
        <div class="bms-card">
            <div class="label">Suhu MOS</div>
            <div class="value"><span id="bmsTemp">--</span><span class="unit">°C</span></div>
        </div>
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="terminal" id="terminalLog">
        <div><span class="time">[system]</span> <span class="info">▶ Siap menerima data BMS</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Klik "Cari BMS" untuk mulai</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Deteksi Header: 55 AA EB 90</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Deteksi Terminator: 41 54 0D 0A</span></div>
        <div><span class="time">[system]</span> <span class="info">▶ Mapping offset sesuai reverse engineering</span></div>
    </div>

    <div class="input-row">
        <input type="text" id="inputField" placeholder="Kirim HEX: 01 03 00 00" />
        <button class="btn btn-primary" id="sendBtn">🚀 Kirim</button>
    </div>

    <div class="btn-group">
        <button class="btn btn-secondary" id="scanBtn">🔍 Cari BMS</button>
        <button class="btn btn-dev" id="devInfoBtn">📱 DevInfo</button>
        <button class="btn btn-bms" id="bmsInfoBtn">🔋 BMSInfo</button>
        <button class="btn btn-reset" id="resetBtn">🔄 Reset</button>
        <button class="btn btn-danger" id="disconnectBtn">⛔ Putus</button>
    </div>
</div>

<script>
    // ============================================================
    // 1. ELEMEN DOM
    // ============================================================
    const terminalLog = document.getElementById('terminalLog');
    const inputField = document.getElementById('inputField');
    const sendBtn = document.getElementById('sendBtn');
    const scanBtn = document.getElementById('scanBtn');
    const devInfoBtn = document.getElementById('devInfoBtn');
    const bmsInfoBtn = document.getElementById('bmsInfoBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const resetBtn = document.getElementById('resetBtn');
    const ledIndicator = document.getElementById('ledIndicator');
    const statusText = document.getElementById('statusText');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    const bmsVoltage = document.getElementById('bmsVoltage');
    const bmsCurrent = document.getElementById('bmsCurrent');
    const bmsSoc = document.getElementById('bmsSoc');
    const bmsTemp = document.getElementById('bmsTemp');

    // ============================================================
    // 2. STATE
    // ============================================================
    let device = null;
    let server = null;
    let characteristic = null;
    let isConnected = false;

    let bmsDataBuffer = [];
    let isCollecting = false;
    let dataTimer = null;

    // ============================================================
    // 3. JK BMS PARSER (Sesuai mapping offset)
    // ============================================================
    class JKBMSParser {
        constructor() {
            this.offset = 0;
            this.cells = 0;
            this.is32S = false;
        }

        getUint16(data, offset) {
            if (offset + 1 >= data.length) return 0;
            return (data[offset + 1] << 8) | data[offset];
        }

        getInt16(data, offset) {
            const val = this.getUint16(data, offset);
            return val > 0x7FFF ? val - 0x10000 : val;
        }

        getUint32(data, offset) {
            if (offset + 3 >= data.length) return 0;
            return (data[offset + 3] << 24) | (data[offset + 2] << 16) | (data[offset + 1] << 8) | data[offset];
        }

        getInt32(data, offset) {
            const val = this.getUint32(data, offset);
            return val > 0x7FFFFFFF ? val - 0x100000000 : val;
        }

        arrayToHexString(bytes) {
            let hex = '';
            for (let i = 0; i < bytes.length; i++) {
                hex += bytes[i].toString(16).padStart(2, '0').toUpperCase();
                if (i < bytes.length - 1) hex += ' ';
            }
            return hex;
        }

        parse(data) {
            if (data.length < 6 || data[0] !== 0x55 || data[1] !== 0xAA || data[2] !== 0xEB || data[3] !== 0x90) {
                throw new Error('Invalid JK BMS header');
            }

            const recordType = data[4];
            const frameCounter = data[5];

            // 2. Cell Voltages (offset 6-69) - 32 cell x 2 byte
            const cellVoltages = [];
            let minVoltage = 100;
            let maxVoltage = 0;
            let totalVoltage = 0;
            let validCells = 0;

            for (let i = 0; i < 32; i++) {
                const offset = 6 + (i * 2);
                if (offset + 1 >= data.length) break;
                const raw = this.getUint16(data, offset);
                const voltage = raw * 0.001;
                
                cellVoltages.push({ cell: i + 1, raw: raw, voltage: voltage });

                if (voltage > 0.1) {
                    totalVoltage += voltage;
                    validCells++;
                    if (voltage < minVoltage) minVoltage = voltage;
                    if (voltage > maxVoltage) maxVoltage = voltage;
                }
            }

            // 3. Cell Metadata (offset 70-79)
            const enabledMask = this.getUint32(data, 70);
            const enabledCells = [];
            for (let i = 0; i < 32; i++) {
                if (enabledMask & (1 << i)) {
                    enabledCells.push(i + 1);
                }
            }
            this.cells = enabledCells.length;

            const avgVoltage = this.getUint16(data, 74) * 0.001;
            const deltaVoltage = this.getUint16(data, 76) * 0.001;
            const balancingCell1 = data[78] || 0;
            const balancingCell2 = data[79] || 0;

            // 4. Wire Resistance (offset 80-143)
            const cellResistances = [];
            for (let i = 0; i < 32; i++) {
                const offset = 80 + (i * 2);
                if (offset + 1 >= data.length) break;
                const raw = this.getUint16(data, offset);
                const resistance = raw * 0.001;
                cellResistances.push({ cell: i + 1, raw: raw, resistance: resistance });
            }

            // 5. Pack Status (offset 144-161)
            const mosTemp = this.getUint16(data, 144) * 0.1;
            const wireWarningMask = this.getUint32(data, 146);
            const totalVoltagePack = this.getUint32(data, 150) * 0.001;
            const power = this.getInt32(data, 154);
            const current = this.getInt32(data, 158) * 0.001;

            // 6. External Temperature Sensors (offset 162-169)
            const temp1Raw = this.getInt16(data, 162);
            const temp1 = temp1Raw === -2000 ? null : temp1Raw * 0.1;
            const temp2Raw = this.getInt16(data, 164);
            const temp2 = temp2Raw === -2000 ? null : temp2Raw * 0.1;
            const reserved1 = this.getUint16(data, 166);
            const mosTempAlt = this.getUint16(data, 168) * 0.5;

            // 7. State of Charge & Capacity (offset 173-185)
            const soc = data[173] || 0;
            const capacityRemain = this.getUint32(data, 174);
            const capacityNominal = this.getUint32(data, 178);
            const cycleCount = this.getUint32(data, 182);

            // Data sisa (offset 186-303)
            const remainingData = data.slice(186);
            const remainingHex = this.arrayToHexString(remainingData);

            // Deteksi terminator
            const hasTerminator = data.length >= 4 && 
                data[data.length-4] === 0x41 && 
                data[data.length-3] === 0x54 && 
                data[data.length-2] === 0x0D && 
                data[data.length-1] === 0x0A;

            // Coba deteksi battery type
            let batteryType = 'Unknown';
            if (data.length > 243) {
                const typeCode = data[243] || 0;
                if (typeCode === 0) batteryType = 'LFP (LiFePO4)';
                else if (typeCode === 1) batteryType = 'Li-ion (NMC)';
                else if (typeCode === 2) batteryType = 'LTO';
            }

            const result = {
                header: {
                    recordType: recordType,
                    frameCounter: frameCounter,
                    totalCells: this.cells,
                    enabledCells: enabledCells,
                    enabledMask: enabledMask,
                    dataLength: data.length,
                    hasTerminator: hasTerminator
                },
                cellVoltages: cellVoltages,
                cellResistances: cellResistances,
                temperatures: [],
                status: {
                    totalVoltage: totalVoltagePack,
                    current: current,
                    power: power,
                    soc: soc,
                    capacityRemain: capacityRemain / 1000,
                    capacityNominal: capacityNominal / 1000,
                    cycleCount: cycleCount,
                    mosTemp: mosTemp,
                    mosTempAlt: mosTempAlt,
                    avgCellVoltage: avgVoltage,
                    deltaVoltage: deltaVoltage,
                    balancingCell1: balancingCell1,
                    balancingCell2: balancingCell2,
                    wireWarningMask: wireWarningMask,
                    temp1: temp1,
                    temp2: temp2,
                    reserved1: reserved1,
                    batteryType: batteryType,
                    chargingMOS: false,
                    dischargingMOS: false,
                    balancing: false,
                    balancingCells: []
                },
                statistics: {
                    minCellVoltage: minVoltage === 100 ? 0 : minVoltage,
                    maxCellVoltage: maxVoltage,
                    averageCellVoltage: validCells > 0 ? totalVoltage / validCells : 0,
                    deltaVoltage: deltaVoltage,
                    validCells: validCells
                },
                raw: {
                    remainingData: remainingHex,
                    enabledMaskHex: '0x' + enabledMask.toString(16).toUpperCase()
                }
            };

            // Temperatures
            if (mosTemp !== null && mosTemp > -50 && mosTemp < 150) {
                result.temperatures.push({ sensor: 'MOS', temp: mosTemp });
            }
            if (temp1 !== null && temp1 > -50 && temp1 < 150) {
                result.temperatures.push({ sensor: 'Temp1', temp: temp1 });
            }
            if (temp2 !== null && temp2 > -50 && temp2 < 150) {
                result.temperatures.push({ sensor: 'Temp2', temp: temp2 });
            }

            // Charging/Discharging status
            if (current > 0.1) {
                result.status.chargingMOS = true;
                result.status.dischargingMOS = false;
                result.status.chargingPower = current * totalVoltagePack;
                result.status.dischargingPower = 0;
            } else if (current < -0.1) {
                result.status.chargingMOS = false;
                result.status.dischargingMOS = true;
                result.status.chargingPower = 0;
                result.status.dischargingPower = Math.abs(current) * totalVoltagePack;
            } else {
                result.status.chargingMOS = false;
                result.status.dischargingMOS = false;
                result.status.chargingPower = 0;
                result.status.dischargingPower = 0;
            }

            // Balance status
            result.status.balancing = (balancingCell1 > 0 || balancingCell2 > 0);
            if (balancingCell1 > 0) result.status.balancingCells.push(balancingCell1);
            if (balancingCell2 > 0) result.status.balancingCells.push(balancingCell2);

            return result;
        }

        formatOutput(result) {
            let lines = [];
            const s = result.status;
            const h = result.header;
            
            lines.push(`📊 JK BMS | ${h.totalCells} Cells (${h.enabledMask > 0xFFFFFF ? '32S' : '24S'})`);
            lines.push(`⚡ Voltage: ${s.totalVoltage.toFixed(3)}V | Current: ${s.current.toFixed(2)}A`);
            lines.push(`🔋 SOC: ${s.soc}% | Cycle: ${s.cycleCount}x`);
            lines.push(`📦 Capacity: ${s.capacityRemain.toFixed(2)}/${s.capacityNominal.toFixed(2)}Ah`);
            
            if (s.mosTemp !== null && s.mosTemp > -50 && s.mosTemp < 150) {
                lines.push(`🌡️ MOS Temp: ${s.mosTemp.toFixed(1)}°C`);
            }
            if (s.temp1 !== null && s.temp1 > -50 && s.temp1 < 150) {
                lines.push(`🌡️ Temp1: ${s.temp1.toFixed(1)}°C`);
            }
            if (s.temp2 !== null && s.temp2 > -50 && s.temp2 < 150) {
                lines.push(`🌡️ Temp2: ${s.temp2.toFixed(1)}°C`);
            }
            
            lines.push(`📊 Avg Cell: ${s.avgCellVoltage.toFixed(3)}V | Delta: ${s.deltaVoltage.toFixed(3)}V`);
            lines.push(`📈 Min: ${result.statistics.minCellVoltage.toFixed(3)}V | Max: ${result.statistics.maxCellVoltage.toFixed(3)}V`);
            
            if (s.balancing) {
                lines.push(`⚖️ Balancing: ON (Cells: ${s.balancingCells.join(', ')})`);
            } else {
                lines.push(`⚖️ Balancing: OFF`);
            }
            
            if (s.chargingMOS) {
                lines.push(`⚡ Charging: ON (${s.chargingPower.toFixed(1)}W)`);
            } else if (s.dischargingMOS) {
                lines.push(`🔋 Discharging: ON (${s.dischargingPower.toFixed(1)}W)`);
            } else {
                lines.push(`💤 Idle`);
            }
            
            if (s.batteryType && s.batteryType !== 'Unknown') {
                lines.push(`🔋 Battery: ${s.batteryType}`);
            }
            
            lines.push(`📊 Enabled Mask: ${h.enabledMask} (${h.enabledMaskHex})`);
            
            if (h.hasTerminator) {
                lines.push(`✅ Terminator: 41 54 0D 0A (valid)`);
            } else {
                lines.push(`⚠️ Terminator: 41 54 0D 0A (tidak ditemukan)`);
            }
            
            // Preview cell voltages
            const cellPreview = result.cellVoltages
                .slice(0, Math.min(8, h.totalCells))
                .map(c => `${c.cell}:${c.voltage.toFixed(3)}V`)
                .join(', ');
            lines.push(`🔋 Cells: ${cellPreview}${h.totalCells > 8 ? ' ...' : ''}`);
            
            // Show remaining data preview if exists
            if (result.raw.remainingData && result.raw.remainingData.length > 0) {
                const preview = result.raw.remainingData.substring(0, 80);
                lines.push(`📄 Remaining: ${preview}${result.raw.remainingData.length > 80 ? ' ...' : ''}`);
            }
            
            return lines;
        }
    }

    // ============================================================
    // 4. FUNGSI LOG TERMINAL
    // ============================================================
    function logTerminal(message, type = 'info') {
        const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
        const entry = document.createElement('div');
        
        const typeMap = {
            'hex_rx': `<span class="time">[${time}]</span> <span class="hex">📥 ${message}</span>`,
            'hex_tx': `<span class="time">[${time}]</span> <span class="hex">📤 ${message}</span>`,
            'hex_dev': `<span class="time">[${time}]</span> <span class="hex-dev">📱 DEV: ${message}</span>`,
            'hex_bms': `<span class="time">[${time}]</span> <span class="hex-bms">🔋 BMS: ${message}</span>`,
            'tx': `<span class="time">[${time}]</span> <span class="hex">📤 ${message}</span>`,
            'success': `<span class="time">[${time}]</span> <span class="success">✅ ${message}</span>`,
            'error': `<span class="time">[${time}]</span> <span class="error">❌ ${message}</span>`,
            'warning': `<span class="time">[${time}]</span> <span class="warning">⚠️ ${message}</span>`,
            'progress': `<span class="time">[${time}]</span> <span class="progress">⏳ ${message}</span>`,
            'packet': `<span class="time">[${time}]</span> <span class="packet-info">📦 ${message}</span>`,
            'ping': `<span class="time">[${time}]</span> <span class="ping">📶 ${message}</span>`,
            'header': `<span class="time">[${time}]</span> <span class="header-info">🔰 ${message}</span>`,
            'raw': `<span class="time">[${time}]</span> <span class="raw-data">📄 ${message}</span>`,
            'terminator': `<span class="time">[${time}]</span> <span class="terminator">⛔ ${message}</span>`,
            'data': `<span class="time">[${time}]</span> <span class="data">${message}</span>`,
            'cell': `<span class="time">[${time}]</span> <span class="cell-data">🔋 ${message}</span>`,
            'temp': `<span class="time">[${time}]</span> <span class="temp-data">🌡️ ${message}</span>`,
            'stat': `<span class="time">[${time}]</span> <span class="stat-data">📊 ${message}</span>`,
        };
        
        entry.innerHTML = typeMap[type] || `<span class="time">[${time}]</span> <span class="${type}">${message}</span>`;
        
        terminalLog.appendChild(entry);
        terminalLog.scrollTop = terminalLog.scrollHeight;
        if (terminalLog.children.length > 500) {
            terminalLog.removeChild(terminalLog.children[0]);
        }
    }

    // ============================================================
    // 5. KONVERSI DATA
    // ============================================================
    function toHexString(buffer) {
        const bytes = new Uint8Array(buffer);
        let hex = '';
        for (let i = 0; i < bytes.length; i++) {
            hex += bytes[i].toString(16).padStart(2, '0').toUpperCase();
            if (i < bytes.length - 1) hex += ' ';
        }
        return hex;
    }

    function arrayToHexString(bytes) {
        let hex = '';
        for (let i = 0; i < bytes.length; i++) {
            hex += bytes[i].toString(16).padStart(2, '0').toUpperCase();
            if (i < bytes.length - 1) hex += ' ';
        }
        return hex;
    }

    function hexStringToBytes(hexString) {
        const cleanHex = hexString.replace(/\s/g, '');
        const bytes = [];
        for (let i = 0; i < cleanHex.length; i += 2) {
            bytes.push(parseInt(cleanHex.substr(i, 2), 16));
        }
        return bytes;
    }

    // ============================================================
    // 6. UPDATE UI BMS
    // ============================================================
    function updateBmsUI(data) {
        if (data.voltage !== undefined && !isNaN(data.voltage) && data.voltage > 0) {
            bmsVoltage.textContent = data.voltage.toFixed(2);
        }
        if (data.current !== undefined && !isNaN(data.current)) {
            bmsCurrent.textContent = data.current.toFixed(2);
        }
        if (data.soc !== undefined && !isNaN(data.soc) && data.soc >= 0 && data.soc <= 100) {
            bmsSoc.textContent = data.soc.toFixed(1);
        }
        if (data.temperature !== undefined && !isNaN(data.temperature)) {
            bmsTemp.textContent = data.temperature.toFixed(1);
        }
    }

    function resetBmsUI() {
        bmsVoltage.textContent = '--';
        bmsCurrent.textContent = '--';
        bmsSoc.textContent = '--';
        bmsTemp.textContent = '--';
    }

    // ============================================================
    // 7. UPDATE PROGRESS
    // ============================================================
    function updateProgress(percent) {
        progressContainer.classList.add('active');
        progressBar.style.width = percent + '%';
        if (percent >= 100) {
            setTimeout(() => {
                progressContainer.classList.remove('active');
                progressBar.style.width = '0%';
            }, 500);
        }
    }

    // ============================================================
    // 8. CEK HEADER & TERMINATOR
    // ============================================================
    function isBMSHeader(bytes) {
        if (bytes.length < 4) return false;
        return bytes[0] === 0x55 && bytes[1] === 0xAA && bytes[2] === 0xEB && bytes[3] === 0x90;
    }

    function isTerminator(bytes) {
        if (bytes.length < 4) return false;
        const len = bytes.length;
        return bytes[len-4] === 0x41 && bytes[len-3] === 0x54 && 
               bytes[len-2] === 0x0D && bytes[len-1] === 0x0A;
    }

    // ============================================================
    // 9. HANDLE DATA MASUK
    // ============================================================
    function handleBmsData(buffer) {
        const bytes = new Uint8Array(buffer);
        const dataLength = bytes.length;
        const hexStr = toHexString(buffer);
        
        logTerminal(`RAW DATA (${dataLength} bytes): ${hexStr}`, 'raw');
        
        // Cek ping (4 bytes tanpa header)
        if (dataLength === 4 && !isBMSHeader(Array.from(bytes))) {
            logTerminal(`Ping: ${hexStr} (diabaikan)`, 'ping');
            return;
        }
        
        const isHeader = isBMSHeader(Array.from(bytes));
        
        if (isHeader) {
            logTerminal(`🔰 HEADER BMS DETEKSI: ${dataLength} bytes`, 'header');
            resetCollector();
            isCollecting = true;
            bmsDataBuffer.push(...Array.from(bytes));
            logTerminal(`📦 Mulai mengumpulkan data BMS...`, 'packet');
            updateProgress(10);
            
            if (dataTimer) clearTimeout(dataTimer);
            dataTimer = setTimeout(() => {
                logTerminal('⏰ Timeout: Tidak ada terminator yang diterima', 'warning');
                resetCollector();
            }, 3000);
            return;
        }
        
        if (isCollecting) {
            bmsDataBuffer.push(...Array.from(bytes));
            
            const progress = Math.min((bmsDataBuffer.length / 304) * 100, 90);
            updateProgress(progress);
            
            if (isTerminator(bmsDataBuffer)) {
                logTerminal(`⛔ TERMINATOR DETEKSI: 41 54 0D 0A`, 'terminator');
                const dataWithoutTerminator = bmsDataBuffer.slice(0, bmsDataBuffer.length - 4);
                const terminatorBytes = bmsDataBuffer.slice(bmsDataBuffer.length - 4);
                
                logTerminal(`📝 Data BMS length: ${dataWithoutTerminator.length} bytes (terminator removed)`, 'info');
                logTerminal(`📝 Terminator: ${arrayToHexString(Array.from(terminatorBytes))}`, 'terminator');
                
                processBMSData(dataWithoutTerminator);
                resetCollector();
                return;
            }
            
            if (dataTimer) {
                clearTimeout(dataTimer);
            }
            dataTimer = setTimeout(() => {
                logTerminal('⏰ Timeout: Tidak ada terminator yang diterima', 'warning');
                resetCollector();
            }, 2000);
        } else {
            logTerminal(`⚠️ Data tidak dikenali: ${dataLength} bytes (bukan header BMS)`, 'warning');
        }
    }

    // ============================================================
    // 10. PROSES DATA BMS
    // ============================================================
    function processBMSData(data) {
        if (data.length === 0) {
            logTerminal('⚠️ Tidak ada data BMS untuk diproses', 'warning');
            return;
        }

        const totalBytes = data.length;
        logTerminal(`📊 Total data BMS: ${totalBytes} bytes`, 'progress');
        
        const bmsHex = arrayToHexString(data);
        logTerminal(`📄 BMS DATA (${totalBytes} bytes): ${bmsHex.substring(0, 200)}${bmsHex.length > 200 ? ' ...' : ''}`, 'raw');

        if (data.length < 6 || 
            data[0] !== 0x55 || data[1] !== 0xAA || 
            data[2] !== 0xEB || data[3] !== 0x90) {
            logTerminal('⚠️ Invalid BMS header! Data mungkin korup.', 'error');
            return;
        }
        
        logTerminal(`🔰 BMS Header valid: 55 AA EB 90`, 'header');

        try {
            const parser = new JKBMSParser();
            const result = parser.parse(data);
            
            if (result) {
                // Update UI
                updateBmsUI({
                    voltage: result.status.totalVoltage,
                    current: result.status.current,
                    soc: result.status.soc,
                    temperature: result.status.mosTemp || 0
                });

                const outputLines = parser.formatOutput(result);
                for (const line of outputLines) {
                    if (line.includes('🌡️')) {
                        logTerminal(line, 'temp');
                    } else if (line.includes('🔋') && !line.includes('SOC') && !line.includes('Battery')) {
                        logTerminal(line, 'cell');
                    } else if (line.includes('📊') || line.includes('📈') || line.includes('📦')) {
                        logTerminal(line, 'stat');
                    } else {
                        logTerminal(line, 'data');
                    }
                }
                logTerminal(`✅ Parsing berhasil (${result.header.totalCells} cells, ${result.header.dataLength} bytes)`, 'success');
            }
        } catch (parseError) {
            logTerminal(`⚠️ Parse error: ${parseError.message}`, 'error');
        }
    }

    // ============================================================
    // 11. RESET COLLECTOR
    // ============================================================
    function resetCollector() {
        bmsDataBuffer = [];
        isCollecting = false;
        if (dataTimer) {
            clearTimeout(dataTimer);
            dataTimer = null;
        }
        updateProgress(0);
    }

    // ============================================================
    // 12. KONEKSI BLUETOOTH
    // ============================================================
    async function connectBle() {
        try {
            logTerminal('🔍 Mencari perangkat BMS...', 'info');

            device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }]
            });

            logTerminal(`✅ Terhubung ke: ${device.name || 'Tanpa Nama'}`, 'success');

            server = await device.gatt.connect();
            isConnected = true;
            updateStatus(true);

            const serviceUUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
            const charUUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

            let service;
            try {
                service = await server.getPrimaryService(serviceUUID);
            } catch (_) {
                const services = await server.getPrimaryServices();
                if (services.length === 0) throw new Error('Tidak ada service');
                service = services[0];
                logTerminal(`ℹ️ Menggunakan service: ${service.uuid}`, 'info');
            }

            characteristic = await service.getCharacteristic(charUUID);
            logTerminal('✅ Karakteristik ditemukan', 'success');

            resetCollector();

            if (characteristic.properties.notify) {
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    handleBmsData(value.buffer);
                });
                logTerminal('📡 Notifikasi diaktifkan', 'info');
                logTerminal('📦 Menunggu header BMS (55 AA EB 90)', 'info');
                logTerminal('📶 Terminator: 41 54 0D 0A', 'info');
                logTerminal('📄 Menggunakan mapping offset reverse engineering', 'info');
            } else {
                logTerminal('⚠️ Karakteristik tidak support notifikasi', 'warning');
            }

            try {
                const value = await characteristic.readValue();
                handleBmsData(value.buffer);
            } catch (_) { /* ignore */ }

        } catch (error) {
            logTerminal(`Error: ${error.message}`, 'error');
            resetBmsUI();
            updateStatus(false);
            resetCollector();
        }
    }

    // ============================================================
    // 13. KIRIM DATA
    // ============================================================
    async function sendHexData(hexString, logType = 'hex_tx') {
        if (!isConnected || !characteristic) {
            logTerminal('Belum terhubung ke BMS', 'error');
            return false;
        }

        try {
            resetCollector();
            
            const bytes = hexStringToBytes(hexString);
            const dataToSend = new Uint8Array(bytes);
            await characteristic.writeValue(dataToSend);
            
            logTerminal(hexString, logType);
            return true;
        } catch (error) {
            logTerminal(`Gagal kirim: ${error.message}`, 'error');
            return false;
        }
    }

    async function sendDevInfo() {
        const hexData = 'AA 55 90 EB 97 00 00 00 00 00 00 00 00 00 00 00 00 00 00 11';
        await sendHexData(hexData, 'hex_dev');
    }

    async function sendBmsInfo() {
        const hexData = 'AA 55 90 EB 96 00 00 00 00 00 00 00 00 00 00 00 00 00 00 10';
        await sendHexData(hexData, 'hex_bms');
    }

    // ============================================================
    // 14. PUTUS KONEKSI & RESET
    // ============================================================
    function disconnect() {
        if (device && device.gatt) {
            try { device.gatt.disconnect(); } catch (_) {}
        }
        isConnected = false;
        device = null;
        server = null;
        characteristic = null;
        updateStatus(false);
        resetBmsUI();
        resetCollector();
        logTerminal('Koneksi diputus', 'error');
    }

    function resetTerminal() {
        terminalLog.innerHTML = '';
        logTerminal('🔄 Terminal di-reset', 'info');
        logTerminal('📦 Deteksi Header: 55 AA EB 90', 'info');
        logTerminal('📶 Deteksi Terminator: 41 54 0D 0A', 'info');
        logTerminal('📄 Mapping offset reverse engineering', 'info');
        resetBmsUI();
        resetCollector();
    }

    // ============================================================
    // 15. UPDATE STATUS
    // ============================================================
    function updateStatus(connected) {
        if (connected) {
            ledIndicator.className = 'led connected';
            statusText.textContent = 'Terhubung';
        } else {
            ledIndicator.className = 'led';
            statusText.textContent = 'Putus';
        }
    }

    // ============================================================
    // 16. EVENT LISTENER
    // ============================================================
    scanBtn.addEventListener('click', connectBle);
    devInfoBtn.addEventListener('click', sendDevInfo);
    bmsInfoBtn.addEventListener('click', sendBmsInfo);
    resetBtn.addEventListener('click', resetTerminal);

    sendBtn.addEventListener('click', () => {
        const text = inputField.value.trim();
        if (!text) {
            logTerminal('Kolom input kosong', 'error');
            return;
        }
        if (text.match(/^[0-9A-Fa-f\s]+$/)) {
            sendHexData(text, 'hex_tx');
        } else {
            sendDataText(text);
        }
        inputField.value = '';
    });

    async function sendDataText(text) {
        if (!isConnected || !characteristic) {
            logTerminal('Belum terhubung ke BMS', 'error');
            return;
        }
        try {
            resetCollector();
            const encoder = new TextEncoder();
            const dataToSend = encoder.encode(text + '\n');
            await characteristic.writeValue(dataToSend);
            logTerminal(text, 'tx');
        } catch (error) {
            logTerminal(`Gagal kirim: ${error.message}`, 'error');
        }
    }

    inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendBtn.click();
        }
    });

    disconnectBtn.addEventListener('click', disconnect);

    // ============================================================
    // 17. INISIALISASI
    // ============================================================
    logTerminal('🚀 Web BMS Terminal siap', 'info');
    logTerminal('💡 Pastikan Bluetooth HP aktif', 'info');
    logTerminal('📌 Klik "Cari BMS" untuk mulai scanning', 'info');
    logTerminal('📦 Deteksi Header: 55 AA EB 90', 'info');
    logTerminal('📶 Deteksi Terminator: 41 54 0D 0A', 'info');
    logTerminal('📄 Mapping offset reverse engineering', 'info');

    if (!navigator.bluetooth) {
        logTerminal('❌ Browser tidak mendukung Web Bluetooth API', 'error');
        logTerminal('ℹ️ Gunakan Chrome di Android / Desktop', 'info');
    }
</script>
